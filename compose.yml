version: '3.9'
services:
  opencode:
    image: 'ghcr.io/anomalyco/opencode:1.1.28'
    restart: unless-stopped
    command:
      - serve
      - '--hostname'
      - 0.0.0.0
      - '--port'
      - '4096'
    entrypoint: >
      sh -c "apk add --no-cache nodejs npm && npm install -g bunx && bunx oh-my-opencode"
    environment:
      OPENCODE_SERVER_PASSWORD: '${OPENCODE_SERVER_PASSWORD}'
      OPENCODE_CONFIG_CONTENT: '{ "$schema": "https://opencode.ai/config.json", "server": { "port": 4096, "hostname": "0.0.0.0"}}'
    volumes:
      - 'workspace:/workspace'
      - 'opencode-config:/root/.config/opencode'
  code-server:
    image: 'codercom/code-server:latest'
    restart: unless-stopped
    environment:
      PASSWORD: '${CODE_SERVER_PASSWORD}'
    volumes:
      - 'workspace:/workspace'
  filebrowser:
    image: 'filebrowser/filebrowser:latest'
    restart: unless-stopped
    volumes:
      - 'workspace:/srv'
      - 'filebrowser-db:/database'
  git:
    image: 'alpine/git:latest'
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - 'workspace:/workspace'
    entrypoint:
      - sh
      - '-c'
      - 'sleep infinity'
volumes:
  workspace:
  opencode-config:
  filebrowser-db:
